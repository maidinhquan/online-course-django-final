<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnlineCourse</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">OnlineCourse</a><a class="btn btn-outline-light" href="/admin/">Admin</a></div></nav><main class="container py-5"><h1>Explore Courses</h1><div class="row g-3">{% for course in courses %}<div class="col-md-6"><div class="card shadow-sm h-100"><div class="card-body"><h2 class="h4">{{ course.name }}</h2><p>{{ course.description }}</p><a class="btn btn-primary" href="{% url 'onlinecourse:course_details' course.id %}">View lessons and exam</a></div></div></div>{% empty %}<p>No courses yet. Run the demo seed command or add a course in Admin.</p>{% endfor %}</div></main></body></html>
